# NOTE: this file was re-committed on 2026-09-15 to force GitHub to re-register
# the workflow. PR #2 added the repository_dispatch and workflow_dispatch triggers,
# but the registered workflow object kept the revision from PR #1 (on: push only),
# so POST /dispatches returned 204 and started nothing. A change to this file on the
# default branch is what makes GitHub re-read the trigger set.
name: Rebase Upstream
on:
  workflow_dispatch:
    inputs:
      target_tag:
        description: "Target upstream release tag (e.g. rust-v0.154.0)"
        required: false
        type: string
        default: ""
  repository_dispatch:
    types: [rebase-upstream]

jobs:
  rebase:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
    env:
      # GITHUB_TOKEN cannot push when upstream changes touch workflows; use the
      # fork secret documented in nymph-ai/nymphai fabric/harnesses/CODEX_AUTOMATION_CREDENTIALS.md
      GH_TOKEN: ${{ secrets.FABRIC_WORKFLOW_PUSH_TOKEN }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config user.name "NymphAI Fork Sync Bot"
          git config user.email "bot@nymphai.internal"
          if [ -n "${GH_TOKEN:-}" ]; then
            gh auth setup-git
          fi

      - name: Fetch Upstream Tags and Branches
        run: |
          git remote add upstream https://github.com/openai/codex.git || true
          git fetch upstream --tags --quiet
          git fetch origin fabric-patchset:refs/remotes/origin/fabric-patchset --quiet

      - name: Determine Target Tag
        id: target
        run: |
          INPUT_TAG="${{ github.event.inputs.target_tag || github.event.client_payload.target_tag }}"
          if [ -n "${INPUT_TAG}" ]; then
            TAG="${INPUT_TAG}"
          else
            TAG=$(git tag -l "rust-v*" --sort=-v:refname | grep -v 'alpha' | grep -v 'rc' | head -n 1)
          fi
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "Selected target tag: ${TAG}"

      - name: Rebase fabric patchset onto upstream tag
        id: rebase
        run: |
          TAG="${{ steps.target.outputs.tag }}"
          if git ls-remote --heads origin "refs/heads/candidate/${TAG}" | grep -q "candidate/${TAG}$"; then
            echo "candidate/${TAG} already exists; skipping automated rebase"
            echo "conflict=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git checkout -B fabric-patchset-rebase origin/fabric-patchset
          chmod +x tools/fork/rebase-upstream.sh
          if ./tools/fork/rebase-upstream.sh "${TAG}"; then
            echo "conflict=false" >> "$GITHUB_OUTPUT"
            git branch -f "candidate/${TAG}" HEAD
            git push -u origin "candidate/${TAG}" --force-with-lease
          else
            echo "conflict=true" >> "$GITHUB_OUTPUT"
            CONFLICTED_FILES=$(git diff --name-only --diff-filter=U 2>/dev/null | tr '\n' ' ' || true)
            echo "conflicted_files=${CONFLICTED_FILES}" >> "$GITHUB_OUTPUT"
            git rebase --abort 2>/dev/null || true
            exit 1
          fi

      - name: Report Rebase Failure
        if: failure()
        run: |
          TAG="${{ steps.target.outputs.tag }}"
          FILES="${{ steps.rebase.outputs.conflicted_files }}"
          if [ "${{ steps.rebase.outputs.conflict }}" = "false" ]; then
            {
              echo "## candidate/${TAG} rebased cleanly but could not be pushed"
              echo
              echo "Push it with a token that has the workflow scope; see"
              echo "fabric/harnesses/codex-sync.md in the monorepo."
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::error title=Candidate push refused::${TAG} rebased cleanly; push candidate/${TAG} with a workflow-scoped token"
            exit 0
          fi
          {
            echo "## Upstream rebase conflict for ${TAG}"
            echo
            echo "Automated rebase via tools/fork/rebase-upstream.sh onto upstream tag ${TAG} hit merge conflicts."
            echo
            echo "- conflicted files: ${FILES}"
            echo
            echo "Resolve them in a worktree and update fabric-patchset; the manual protocol is in"
            echo "fabric/harnesses/codex-sync.md in the monorepo."
          } >> "$GITHUB_STEP_SUMMARY"
          echo "::error title=Upstream rebase conflict::${TAG} conflicts in ${FILES}"
